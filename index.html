<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JPTE 生产进度跟踪系统</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="loginPage" class="page">
  <div class="login-box">
    <h1>JPTE 生产进度跟踪</h1>
    <input id="email" type="email" placeholder="邮箱" />
    <input id="password" type="password" placeholder="密码" />
    <button id="loginBtn" onclick="login()">登录</button>
    <div id="loginError" class="error"></div>
  </div>
</div>

<div id="mainPage" class="page" style="display:none;">
  <header class="topbar">
    <div class="logo">JPTE</div>
    <nav class="nav">
      <a href="#" onclick="goToDashboard();return false;">订单看板</a>
      <a href="#" onclick="goToOrders();return false;">订单列表</a>
      <a href="#" onclick="goToLogs();return false;">修改历史</a>
      <a href="#" onclick="goToBaseData();return false;" id="navBaseData" style="display:none;">基础数据</a>
    </nav>
    <div class="user-info">
      <span id="userEmail"></span>
      <span id="userRole" class="role-badge"></span>
      <button onclick="logout()">退出</button>
    </div>
  </header>

  <section id="dashboardPage" class="content" style="display:none;">
    <h2>订单看板</h2>
    <div id="dashboardCards" class="cards"></div>
    <div id="dashboardStage" class="stage-stats"></div>
  </section>

  <section id="ordersPage" class="content" style="display:none;">
    <h2>订单列表</h2>
    <div class="filters">
      <input id="filterPO" placeholder="PO#" oninput="renderOrders()" />
      <input id="filterContract" placeholder="合同号" oninput="renderOrders()" />
      <input id="filterCustomer" placeholder="客户" oninput="renderOrders()" />
      <input id="filterSales" placeholder="业务员" oninput="renderOrders()" />
      <select id="filterStatus" onchange="renderOrders()">
        <option value="">全部状态</option>
        <option value="pending">待处理</option>
        <option value="in_progress">进行中</option>
        <option value="completed">已完成</option>
        <option value="cancelled">已取消</option>
        <option value="on_hold">暂停</option>
      </select>
      <button onclick="openNewOrder()" id="btnNewOrder">新建订单</button>
    </div>
    <table id="ordersTable">
      <thead>
        <tr>
          <th>PO#</th><th>合同号</th><th>序号</th><th>客户</th>
          <th>下单日期</th><th>合同交期</th><th>排单周期</th>
          <th>业务员</th><th>合同数量(Y)</th><th>计划数量(M)</th>
          <th>状态</th><th>生产周期</th><th>操作</th>
        </tr>
      </thead>
      <tbody id="ordersBody"></tbody>
    </table>
  </section>

  <section id="orderDetailPage" class="content" style="display:none;">
    <button onclick="goToOrders()">← 返回列表</button>
    <div id="orderHeader" class="order-header"></div>
    <div class="tabs">
      <button class="tab active" data-tab="plan" onclick="switchTab('plan')">计划</button>
      <button class="tab" data-tab="craft" onclick="switchTab('craft')">工艺</button>
      <button class="tab" data-tab="dyeing" onclick="switchTab('dyeing')">染色</button>
      <button class="tab" data-tab="warping" onclick="switchTab('warping')">整经</button>
      <button class="tab" data-tab="sizing" onclick="switchTab('sizing')">浆纱</button>
      <button class="tab" data-tab="drawing" onclick="switchTab('drawing')">穿综</button>
      <button class="tab" data-tab="weaving" onclick="switchTab('weaving')">织造</button>
      <button class="tab" data-tab="grey" onclick="switchTab('grey')">坯布</button>
      <button class="tab" data-tab="finishing" onclick="switchTab('finishing')">后整理</button>
      <button class="tab" data-tab="finished" onclick="switchTab('finished')">成品</button>
    </div>
    <div id="tabContent" class="tab-content"></div>
  </section>

  <section id="logsPage" class="content" style="display:none;">
    <h2>修改历史</h2>
    <div id="logsContent"></div>
  </section>

  <section id="baseDataPage" class="content" style="display:none;">
    <h2>基础数据维护</h2>
    <div class="tabs" id="baseDataTabs">
      <button class="tab active" data-cat="fg_code" onclick="switchBaseDataTab('fg_code')">FG CODE</button>
      <button class="tab" data-cat="customer_code" onclick="switchBaseDataTab('customer_code')">客户</button>
      <button class="tab" data-cat="weave_code" onclick="switchBaseDataTab('weave_code')">织法</button>
      <button class="tab" data-cat="daily_output" onclick="switchBaseDataTab('daily_output')">纬密→产量</button>
      <button class="tab" data-cat="sioc_addon" onclick="switchBaseDataTab('sioc_addon')">SIOC加成</button>
      <button class="tab" data-cat="customer_addon" onclick="switchBaseDataTab('customer_addon')">客户加成</button>
      <button class="tab" data-cat="weave_addon" onclick="switchBaseDataTab('weave_addon')">织法加成</button>
    </div>
    <div class="filters">
      <label><input type="checkbox" id="showInactive" onchange="renderBaseData()" /> 显示已停用</label>
      <button onclick="openNewBaseData()">新增</button>
    </div>
    <table>
      <thead>
        <tr><th>Key1</th><th>Key2</th><th>Value</th><th>备注</th><th>状态</th><th>操作</th></tr>
      </thead>
      <tbody id="baseDataBody"></tbody>
    </table>
  </section>
</div>

<script src="app.js"></script>
</body>
</html>
